# Render Blueprint — PNC Journey Star backend
#
# Covers this repository only (the API + its database). The frontend lives in
# a separate repo, so it needs its own service; point its API base URL at this
# service's URL and add that origin to CORS_ORIGIN below.
#
# Apply with: Render Dashboard → Blueprints → New Blueprint Instance.
# Values marked `sync: false` are deliberately left blank here and typed into
# the dashboard at apply time so secrets never land in git.

databases:
  - name: pnc-journey-db
    databaseName: pnc_journey_star
    user: pnc_journey
    region: singapore
    plan: basic-256mb
    # Matches the postgres:16-alpine image used by docker-compose locally, so
    # the migrations run against the same major version they were built on.
    postgresMajorVersion: '16'

services:
  - type: web
    name: pnc-journey-api
    runtime: docker
    region: singapore
    # A disk requires a paid instance, and the free tier's ~50s cold start
    # after 15 minutes idle is a poor demo. Starter stays warm.
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # `runner` is the final stage in the Dockerfile, so it is built by default.
    healthCheckPath: /api/v1/health
    autoDeploy: true

    # Render's filesystem is ephemeral: without this, every deploy wipes the
    # avatars written by multer in users.controller.ts. The mount path is fed
    # to the app through UPLOAD_DIR below; the controller creates the
    # `avatars` subdirectory itself via mkdirSync(recursive).
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      # Matches EXPOSE in the Dockerfile and the health check port.
      - key: PORT
        value: '8000'
      - key: APP_PREFIX
        value: api/v1

      # Internal connection string — same region, no SSL negotiation, no
      # egress cost. Prisma defaults to the `public` schema, so the
      # `?schema=public` suffix used locally is not needed here.
      - key: DATABASE_URL
        fromDatabase:
          name: pnc-journey-db
          property: connectionString

      # Render generates these once and keeps them across deploys. Both must
      # clear the 16-character minimum and must not contain "change-me", or
      # env.validation.ts refuses to boot in production.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # Comma-separated list of frontend origins, e.g.
      #   https://pnc-journey-star.onrender.com
      - key: CORS_ORIGIN
        sync: false

      # prisma/seed.ts calls resetDatabase(), which deleteMany()s every table
      # including users. docker-entrypoint.sh runs on EVERY boot, so leaving
      # this true would wipe production on each deploy and each restart.
      # Seed once by hand from the Render shell instead.
      - key: SEED_ON_START
        value: 'false'

      # Persisted uploads land on the disk mounted above rather than in the
      # container's ephemeral layer.
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: UPLOAD_PUBLIC_PATH
        value: /uploads

      # Mail — without these the app falls back to an Ethereal test account,
      # meaning password-reset and OTP messages are never actually delivered.
      # SMTP_PASS must be a Gmail App Password, not the account password.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
