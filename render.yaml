# Render Blueprint — PNC Journey Star backend
#
# Covers this repository only (the API + its database). The frontend lives in
# a separate repo, so it needs its own service; point its API base URL at this
# service's URL and add that origin to CORS_ORIGIN below.
#
# Apply with: Render Dashboard → Blueprints → New Blueprint Instance.
# Values marked `sync: false` are deliberately left blank here and typed into
# the dashboard at apply time so secrets never land in git.

databases:
  - name: pnc-journey-db
    databaseName: pnc_journey_star
    user: pnc_journey
    region: singapore
    # Free Postgres is time-limited — Render expires the instance after a set
    # window (historically ~30 days) and it is NOT restored automatically.
    # Check the expiry date on the database's dashboard page and back up with
    # `pg_dump` before it lapses.
    plan: free
    # Matches the postgres:16-alpine image used by docker-compose locally, so
    # the migrations run against the same major version they were built on.
    postgresMajorVersion: '16'

services:
  - type: web
    name: pnc-journey-api
    runtime: docker
    region: singapore
    # Free spins the container down after ~15 minutes idle; the next request
    # pays a cold start of roughly a minute while the image boots and the
    # migrations re-run. Hit the health endpoint a few minutes before a live
    # demo so the first real request is not the one that wakes it.
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # `runner` is the final stage in the Dockerfile, so it is built by default.
    healthCheckPath: /api/v1/health
    autoDeploy: true

    # NOTE: no `disk:` block — Render disks require a paid instance. Avatars
    # written by multer in users.controller.ts therefore live on the
    # container's ephemeral layer and are lost on every deploy, restart, and
    # idle spin-down. See UPLOAD_DIR below.

    envVars:
      - key: NODE_ENV
        value: production
      # Matches EXPOSE in the Dockerfile and the health check port.
      - key: PORT
        value: '8000'
      - key: APP_PREFIX
        value: api/v1

      # Internal connection string — same region, no SSL negotiation, no
      # egress cost. Prisma defaults to the `public` schema, so the
      # `?schema=public` suffix used locally is not needed here.
      - key: DATABASE_URL
        fromDatabase:
          name: pnc-journey-db
          property: connectionString

      # Render generates these once and keeps them across deploys. Both must
      # clear the 16-character minimum and must not contain "change-me", or
      # env.validation.ts refuses to boot in production.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # Comma-separated list of frontend origins, e.g.
      #   https://pnc-journey-star.onrender.com
      - key: CORS_ORIGIN
        sync: false

      # prisma/seed.ts calls resetDatabase(), which deleteMany()s every table
      # including users. docker-entrypoint.sh runs on EVERY boot, and a free
      # instance boots every time it wakes from an idle spin-down — so leaving
      # this true would silently wipe the database several times a day.
      # Seed once from your own machine against the external DATABASE_URL
      # instead (the Render shell is not available on free instances).
      - key: SEED_ON_START
        value: 'false'

      # No disk on the free plan, so this is the container's own filesystem
      # and uploaded avatars do not survive a redeploy or a spin-down. The
      # records still point at the missing files, so those images render
      # broken until re-uploaded. Attach a disk and switch this to
      # /data/uploads if the uploads need to persist.
      - key: UPLOAD_DIR
        value: uploads
      - key: UPLOAD_PUBLIC_PATH
        value: /uploads

      # Mail — without these the app falls back to an Ethereal test account,
      # meaning password-reset and OTP messages are never actually delivered.
      # SMTP_PASS must be a Gmail App Password, not the account password.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
