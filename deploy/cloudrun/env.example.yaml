# Non-secret environment for the Cloud Run service.
#
#   cp env.example.yaml env.production.yaml   # then edit; env.production.yaml is gitignored
#   gcloud run deploy ... --env-vars-file=deploy/cloudrun/env.production.yaml
#
# Secrets are NOT here. DATABASE_URL, JWT_SECRET, JWT_REFRESH_SECRET and
# SMTP_PASS come from Secret Manager via --set-secrets. See
# docs/cloud-run-deployment.md.
#
# NOTE: PORT is intentionally absent. Cloud Run injects it (8080 by default)
# and rejects a deploy that sets it explicitly. The app already reads it.

NODE_ENV: 'production'
APP_PREFIX: 'api/v1'

# Migrations are applied as a separate, deliberate step — not by every
# cold-started instance. See the runbook.
RUN_MIGRATIONS: 'false'
SEED_ON_START: 'false'

# Comma-separated. Replace with the deployed frontend origin(s); a value that
# still points at localhost means the real frontend gets blocked by CORS.
CORS_ORIGIN: 'https://your-frontend.example.com'

# Cloud Run's filesystem is in-memory and per-instance: anything written here
# is lost on scale-down and is invisible to other instances. /tmp is writable
# and fine for a demo. For avatars that must survive, mount a GCS bucket and
# point UPLOAD_DIR at the mount instead (runbook, "Persisting uploads").
UPLOAD_DIR: '/tmp/uploads'
UPLOAD_PUBLIC_PATH: '/uploads'

# Mail — SMTP_PASS is a secret and is set separately.
SMTP_HOST: 'smtp.gmail.com'
SMTP_PORT: '587'
SMTP_SECURE: 'false'
SMTP_USER: 'your-account@gmail.com'
MAIL_FROM: 'PNC Journey Star <your-account@gmail.com>'
