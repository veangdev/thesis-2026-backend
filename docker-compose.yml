# Pinned so the project name survives folder renames. Compose derives it from
# the directory by default, and the rename thesis-backend → thesis-2026-backend
# would otherwise point at a new, empty `<project>_postgres_data` volume and
# silently strand the existing database.
name: thesis-backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: pnc_journey_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pnc_journey_star
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: runner
    container_name: pnc_journey_app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Bind the app to 8000 inside the container (overrides PORT from .env)
      # so the published port and healthcheck below line up.
      PORT: '8000'
      # WORKAROUND: ufw's DEFAULT_FORWARD_POLICY="DROP" wipes Docker's FORWARD
      # rules on reload/reboot, which kills all container-to-container traffic
      # on the bridge. The service-name route below is the correct one and
      # should be restored once ufw is fixed:
      #   DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pnc_journey_star?schema=public
      # Until then, reach Postgres via its published host port, which still
      # works because that path is DNAT rather than bridge forwarding.
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5433/pnc_journey_star?schema=public
      # Seed demo users (admin/mentor/student) on first boot. Idempotent.
      SEED_ON_START: 'true'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://localhost:8000/api/v1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
